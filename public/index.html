<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Radar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e14;
            color: #c7cdd8;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }
        #status {
            position: fixed;
            top: 16px;
            right: 16px;
            padding: 8px 16px;
            background: rgba(0,0,0,0.7);
            border-radius: 4px;
            font-size: 13px;
        }
        #map-info {
            position: fixed;
            top: 16px;
            left: 16px;
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #radar {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1f29;
            border: 2px solid #2d3748;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }
        .player {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.1s ease-out;
        }
        .player.ally { background: #4ade80; border: 2px solid #22c55e; }
        .player.enemy { background: #ef4444; border: 2px solid #dc2626; }
        .player-label {
            position: absolute;
            font-size: 11px;
            white-space: nowrap;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }
        .player-direction {
            position: absolute;
            width: 2px;
            height: 16px;
            background: currentColor;
            opacity: 0.7;
            top: -16px;
            left: 50%;
            transform-origin: bottom center;
        }
    </style>
</head>
<body>
    <div id="status">Connecting...</div>
    <div id="map-info">-</div>
    <canvas id="radar" width="800" height="800"></canvas>

    <script>
        const canvas = document.getElementById('radar');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        const mapInfo = document.getElementById('map-info');

        // CS2 map configurations (positions and scales)
        const MAP_CONFIGS = {
            'de_mirage': { min_x: -3230, max_x: 1713, min_y: -3781, max_y: 1408, scale: 1.0 },
            'de_dust2': { min_x: -2476, max_x: 3239, min_y: -2475, max_y: 2425, scale: 1.0 },
            'de_inferno': { min_x: -2087, max_x: 3870, min_y: -3870, max_y: 1600, scale: 1.0 },
            'de_nuke': { min_x: -3453, max_x: 2887, min_y: -3394, max_y: 2887, scale: 1.0 },
            'de_overpass': { min_x: -4831, max_x: 1781, min_y: -3441, max_y: 1524, scale: 1.0 },
            'de_vertigo': { min_x: -3168, max_x: 2064, min_y: -3168, max_y: 2064, scale: 1.0 },
            'de_ancient': { min_x: -2953, max_x: 2548, min_y: -3110, max_y: 2253, scale: 1.0 },
            'de_anubis': { min_x: -2796, max_x: 3157, min_y: -3536, max_y: 1910, scale: 1.0 }
        };

        let currentMap = 'de_dust2';
        let mapBounds = MAP_CONFIGS['de_dust2'];
        let mapImage = new Image();
        let mapImageLoaded = false;

        let ws = null;
        let radarData = null;

        function loadMapImage(mapName) {
            if (!MAP_CONFIGS[mapName]) {
                mapName = 'de_dust2'; // fallback
            }
            currentMap = mapName;
            mapBounds = MAP_CONFIGS[mapName];

            mapImageLoaded = false;
            mapImage.src = `https://raw.githubusercontent.com/Jofairden/css-assets/master/csgo/maps/radar/${mapName}_radar.png`;
            mapImage.onload = () => {
                mapImageLoaded = true;
            };
            mapImage.onerror = () => {
                console.log('Map image failed to load, using grid fallback');
                mapImageLoaded = false;
            };
        }

        function connect() {
            const wsUrl = location.protocol === 'https:'
                ? `wss://${location.host}/ws`
                : `ws://${location.host}`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                status.textContent = 'Connected';
                status.style.background = 'rgba(34, 197, 94, 0.3)';
            };

            ws.onmessage = (event) => {
                radarData = JSON.parse(event.data);
                if (radarData.map && radarData.map !== currentMap) {
                    loadMapImage(radarData.map);
                }
                mapInfo.textContent = radarData.map || 'unknown';
                render();
            };

            ws.onclose = () => {
                status.textContent = 'Disconnected';
                status.style.background = 'rgba(239, 68, 68, 0.3)';
                setTimeout(connect, 2000);
            };
        }

        function worldToRadar(x, y) {
            const px = ((x - mapBounds.min_x) / (mapBounds.max_x - mapBounds.min_x)) * canvas.width;
            const py = canvas.height - ((y - mapBounds.min_y) / (mapBounds.max_y - mapBounds.min_y)) * canvas.height;
            return { x: px, y: py };
        }

        function render() {
            if (!radarData) return;

            // Clear
            ctx.fillStyle = '#1a1f29';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw map image if loaded
            if (mapImageLoaded) {
                ctx.globalAlpha = 0.6;
                ctx.drawImage(mapImage, 0, 0, canvas.width, canvas.height);
                ctx.globalAlpha = 1.0;
            } else {
                // Grid fallback
                ctx.strokeStyle = '#2d3748';
                ctx.lineWidth = 1;
                for (let i = 0; i <= 8; i++) {
                    const pos = (canvas.width / 8) * i;
                    ctx.beginPath();
                    ctx.moveTo(pos, 0);
                    ctx.lineTo(pos, canvas.height);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, pos);
                    ctx.lineTo(canvas.width, pos);
                    ctx.stroke();
                }
            }

            // Draw players
            const drawPlayer = (p, isAlly) => {
                const pos = worldToRadar(p.x, p.y);

                // Direction line
                ctx.save();
                ctx.translate(pos.x, pos.y);
                ctx.rotate((p.yaw + 90) * Math.PI / 180);
                ctx.strokeStyle = isAlly ? '#4ade80' : '#ef4444';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, -16);
                ctx.stroke();
                ctx.restore();

                // Player dot
                ctx.fillStyle = isAlly ? '#4ade80' : '#ef4444';
                ctx.strokeStyle = isAlly ? '#22c55e' : '#dc2626';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Name + health
                ctx.fillStyle = '#ffffff';
                ctx.font = '11px sans-serif';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(0,0,0,0.9)';
                ctx.shadowBlur = 3;
                ctx.fillText(`${p.name} [${p.health}]`, pos.x, pos.y - 12);
                ctx.shadowBlur = 0;
            };

            radarData.allies.forEach(p => drawPlayer(p, true));
            radarData.enemies.forEach(p => drawPlayer(p, false));
        }

        // Initialize
        loadMapImage('de_dust2');
        connect();
        setInterval(render, 100);
    </script>
</body>
</html>
